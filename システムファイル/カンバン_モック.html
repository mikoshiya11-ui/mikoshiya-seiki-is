<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カンバン｜SAKAE SEIKI-iS</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#e9edf3; color:#1a2233;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .screenBar{
    display:flex; align-items:center; gap:12px; padding:10px 18px; background:#173a68; color:#fff; font-size:13px;
  }
  .screenBar a{ color:#cfe0f5; text-decoration:none; font-size:12px; }
  .screenBar a:hover{ text-decoration:underline; }
  .screenBar button{
    margin-left:auto; border:none; background:#e67e22; color:#fff; font-weight:700; font-size:12.5px;
    padding:7px 16px; border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .screenBar button:hover{ filter:brightness(1.08); }

  @page{ size: A4 portrait; margin: 6mm; }

  .sheetOuter{ display:flex; justify-content:center; padding:18px; }
  .sheet{
    background:#fff; width:198mm; height:285mm; box-shadow:0 4px 20px rgba(0,0,0,.15);
    border:1.2px solid #222; display:flex; flex-direction:column;
  }
  .kanbanPanel{
    flex:1 1 50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8mm; min-height:0; position:relative;
  }
  /* ---- 主表示：現物Excel「看板」シートと同じく型番＋品名の2行だけを大きく中央に出す ---- */
  .kanbanPanel .model{ font-size:42px; font-weight:700; letter-spacing:2px; text-align:center; }
  .kanbanPanel .itemName{ font-size:24px; font-weight:700; text-align:center; margin-top:5mm; }
  /* ---- 補助情報：現物Excelには無い項目（作業指示書9.4の指定により追加）。主表示の邪魔にならないよう
     панелの下端に小さく分離して置く。品番はここに含める（現物にも無い項目のため） ---- */
  .kanbanPanel .subInfo{
    position:absolute; left:8mm; right:8mm; bottom:6mm;
    border-top:1px dashed #d7dce4; padding-top:2.5mm;
    display:grid; grid-template-columns:repeat(2, 1fr); gap:1.2mm 8mm; font-size:9.5px; color:#a4adbc;
  }
  .kanbanPanel .subInfo .k{ color:#b7c1d1; font-weight:700; }
  .kanbanPanel .subInfo .v{ color:#8592a6; font-weight:700; }

  .cutLine{
    flex:0 0 auto; border-top:1.5px dashed #8592a6; position:relative; margin:0 6mm;
  }
  .cutLine::after{
    content:'✂ 切り取り線'; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
    background:#fff; padding:0 8px; font-size:9px; color:#8592a6;
  }

  @media print{
    body{ background:#fff; }
    .screenBar{ display:none; }
    .sheetOuter{ padding:0; }
    /* ---- widthとheightはautoにしない：.sheetの198mm×285mmは@pageの印刷可能領域（A4 210×297mmから
       margin6mm×2を引いた値）と一致させてあり、上下2つのkanbanPanelがflex:1 1 50%でちょうど
       半分ずつに広がることで初めて「上下2面」のレイアウトになる。autoにすると内容の少なさで
       枠が縮み、ページ下半分が大きく余白化してしまう（実機の印刷プレビューで確認された不具合）---- */
    .sheet{ box-shadow:none; border:1px solid #222; }
  }
  .emptyState{ color:#c0392b; font-size:13px; padding:30px; text-align:center; }
</style>
<script src="_sakaeSupabaseConfig.js"></script>
<script src="_sakaeSync.js"></script>
<script src="_workStartPrintCommon.js"></script>
</head>
<body>

  <div class="screenBar">
    <a href="#" id="backLink">← 作業開始印刷セットへ戻る</a>
    <span>カンバン（A4縦・上下2面）</span>
    <button type="button" onclick="window.print()">🖨 印刷</button>
  </div>

  <div class="sheetOuter" id="sheetOuter"></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const productNo = (params.get('productNo') || '').trim();
  const P = window.sakaeWorkStartPrint;
  document.getElementById('backLink').setAttribute('href', '作業開始印刷セット_モック.html?productNo='+encodeURIComponent(productNo));

  const sheetOuter = document.getElementById('sheetOuter');
  if(!productNo){
    sheetOuter.innerHTML = '<div class="emptyState">品番が指定されていません。</div>';
    return;
  }

  // ---- 現物Excel「看板」シートは型番＋品名の2行だけの簡素な作りだったため、主表示はそれに合わせる。
  // 社内No・数量・客先・納期・品番は作業指示書9.4の指定により追加した補助情報（現物には無い）。
  // 主表示の邪魔にならないよう、パネル下端に小さく分離して表示する ----
  function panelHtml(o){
    return '<div class="kanbanPanel">'
      + '<div class="model">'+P.esc(o.model||'（型番未入力）')+'</div>'
      + '<div class="itemName">'+P.esc(o.itemName||'')+'</div>'
      + '<div class="subInfo">'
      +   '<div class="k">品番</div><div class="v">'+P.esc(o.productNo||'')+'</div>'
      +   '<div class="k">社内No.</div><div class="v">'+P.esc(o.orderNo||'')+'</div>'
      +   '<div class="k">数量</div><div class="v">'+P.esc(o.qty||'')+'</div>'
      +   '<div class="k">客先</div><div class="v">'+P.esc(o.customer||'')+'</div>'
      +   '<div class="k">納期</div><div class="v">'+P.esc(P.fmtDateJp(o.dueDate))+'</div>'
      + '</div>'
      + '</div>';
  }

  function render(){
    const bs = P.loadBs(productNo);
    if(!bs || !bs.order){
      sheetOuter.innerHTML = '<div class="emptyState">品番「'+P.esc(productNo)+'」の作業票データが見つかりません。先に作業票を作成してください。</div>';
      return;
    }
    const o = bs.order || {};
    sheetOuter.innerHTML =
      '<div class="sheet">'
      + panelHtml(o)
      + '<div class="cutLine"></div>'
      + panelHtml(o)
      + '</div>';
  }
  render();
  window.addEventListener('storage', (e)=>{
    if(e.key !== P.storageKeyFor(productNo)) return;
    render();
  });
})();
</script>
</body>
</html>
